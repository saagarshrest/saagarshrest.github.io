/* ---------- tile access ---------- */
function tileAt(tx,ty){if(tx<0)return 6;if(tx>=LV.len)return 6;if(ty<0||ty>=ROWS)return 0;return LV.map[tx][ty];}
function solid(tx,ty){return SOLID.has(tileAt(tx,ty));}
function setT(tx,ty,v){if(tx>=0&&tx<LV.len&&ty>=0&&ty<ROWS)LV.map[tx][ty]=v;}
function solidRect(x,y,w,h){for(let ty=Math.floor(y/T);ty<=Math.floor((y+h-0.01)/T);ty++)for(let tx=Math.floor(x/T);tx<=Math.floor((x+w-0.01)/T);tx++)if(solid(tx,ty))return true;return false;}
function moveBody(b,oneway=true){const res={l:0,r:0,g:0,c:0,ctx:-1,cty:-1};
 b.x+=b.vx;
 const y0=Math.floor(b.y/T),y1=Math.floor((b.y+b.h-0.01)/T);
 if(b.vx>0){const tx=Math.floor((b.x+b.w-0.01)/T);for(let ty=y0;ty<=y1;ty++)if(solid(tx,ty)){b.x=tx*T-b.w;res.r=1;break;}}
 else if(b.vx<0){const tx=Math.floor(b.x/T);for(let ty=y0;ty<=y1;ty++)if(solid(tx,ty)){b.x=(tx+1)*T;res.l=1;break;}}
 const prevB=b.y+b.h;b.y+=b.vy;b.onGround=false;
 const x0=Math.floor(b.x/T),x1=Math.floor((b.x+b.w-0.01)/T);
 if(b.vy>0){const ty=Math.floor((b.y+b.h-0.01)/T);for(let tx=x0;tx<=x1;tx++){const v=tileAt(tx,ty);if(SOLID.has(v)||(oneway&&v===9&&prevB<=ty*T+0.5)){b.y=ty*T-b.h;b.vy=0;b.onGround=true;res.g=1;break;}}}
 else if(b.vy<0){const ty=Math.floor(b.y/T);const cx=Math.floor((b.x+b.w/2)/T);let hit=-1;if(solid(cx,ty))hit=cx;else for(let tx=x0;tx<=x1;tx++)if(solid(tx,ty)){hit=tx;break;}
  if(hit>=0){b.y=(ty+1)*T;b.vy=0;res.c=1;res.ctx=hit;res.cty=ty;}}
 return res;}
function groundAhead(e,dir){const tx=Math.floor((dir>0?e.x+e.w+1:e.x-1)/T),ty=Math.floor((e.y+e.h+1)/T);const v=tileAt(tx,ty);return SOLID.has(v)||v===9;}

const EDEF={grunt:{w:12,h:14,hp:1,pts:100},hopper:{w:12,h:14,hp:1,pts:200},shellbot:{w:14,h:12,hp:2,pts:200},bat:{w:12,h:9,hp:1,pts:200},turret:{w:14,h:10,hp:4,pts:500},spiker:{w:12,h:12,hp:3,pts:300},soldier:{w:10,h:14,hp:2,pts:300},ember:{w:8,h:8,hp:2,pts:100},pod:{w:16,h:10,hp:1,pts:500}};
function spawnEnemy(s){const d=EDEF[s.type];if(!d)return;const e={kind:'enemy',type:s.type,x:s.x,y:s.gy-d.h,w:d.w,h:d.h,vx:0,vy:0,hp:d.hp+(LV.w>=6&&s.type!=='ember'?1:0),pts:d.pts,face:-1,t:(Math.random()*60)|0,st:'walk',flash:0,onGround:false,var:(LV.w-1)%3};

 if(s.type==='bat'){e.st='hang';e.y=s.gy-d.h-(s.gy<10*T?0:40);e.hy=e.y;}
 if(s.type==='ember'){e.st='wait';e.base=s.gy;e.y=s.gy+20;e.t=(Math.random()*80)|0;}
 if(s.type==='turret'){e.x=s.x-7;}

 if(s.type==='soldier')e.wpn=pick();else if((s.type==='grunt'||s.type==='hopper')&&Math.random()<Math.min(0.6,0.14+LV.diff*0.025))e.wpn=pick();else if(s.type==='bat'&&LV.w>=2&&Math.random()<0.45)e.wpn='bomb';

const MEDALS=[['M',3],['S',3],['L',2],['F',2],['R',2],['B',1]];
function randMedal(){let t=0;for(const m of MEDALS)t+=m[1];let r=Math.random()*t;for(const m of MEDALS){r-=m[1];if(r<=0)return m[0];}return 'M';}

function killEnemy(e,how){if(e.dead)return;e.dead=true;
 if(e.type==='pod'){boomFx(e.x+8,e.y+5,true);spawnMedal(e.x+1,e.y,null,-3.5);popScore(e.x,e.y,e.pts);SFX.boom();return;}
 let pts=e.pts;if(how==='stomp'){combo++;pts=[100,200,400,800,1000,2000,4000,8000][Math.min(7,combo-1)];if(combo>=9){oneUp(e.x,e.y);pts=0;}}

 if(how==='stomp')SFX.stomp();else SFX.boom();

 const img=enemyImg(e);if(img)addPart({k:'corpse',x:e.x+e.w/2-8,y:e.y+e.h-16,vx:(Math.random()<.5?-1:1)*0.8,vy:-3.5,t:0,life:90,img:vflipC(img)});}
function hitEnemy(e,dmg){if(e.dead)return;if(e.type==='ember'){e.st='wait';e.y=e.base+20;e.t=0;boomFx(e.x+4,e.y-20,false);return;}
 if(e.type==='shellbot'&&e.st!=='walk'){e.hp-=dmg;}else e.hp-=dmg;e.flash=6;SFX.ehit();if(e.hp<=0)killEnemy(e,'shot');}
function enemyImg(e){const fr=((G.frame+e.t)>>3)&1;switch(e.type){

 case 'shellbot':{if(e.st!=='walk')return SPR.shell.s;const s=SPR.shell;return (fr?s.a:s.b)[e.vx>0?'r':'l'];}
 case 'bat':return (e.st==='hang'?SPR.bat.d:(((G.frame+e.t)>>2)&1?SPR.bat.u:SPR.bat.d));
 case 'turret':return SPR.turret;

}return null;}

function newPlayer(x,y){return {x,y,w:10,h:14,vx:0,vy:0,face:1,onGround:false,crouch:false,weapon:'N',rapid:false,barrier:0,inv:0,cd:0,anim:0,coyote:0,jbuf:0,aim:'f',dead:false,ride:null,auto:0};}
const WEAP={N:{cd:11,sp:4.2,max:4,dmg:1},M:{cd:6,sp:5,max:14,dmg:1},S:{cd:15,sp:4,max:20,dmg:1},L:{cd:20,sp:6.5,max:3,dmg:4},F:{cd:14,sp:3,max:5,dmg:2}};
function fire(p){const wp=WEAP[p.weapon];const rf=p.rapid?0.62:1;
 if(shots.length>=wp.max*(p.rapid?1.5:1))return;
 let dx=p.face,dy=0;const a=p.aim;if(a==='u'){dx=0;dy=-1;}else if(a==='du'){dx=p.face*0.7071;dy=-0.7071;}else if(a==='dd'){dx=p.face*0.7071;dy=0.7071;}else if(a==='d'){dx=0;dy=1;}
 const gp=GUN_POS[p.crouch?'fc':a];let mx=gp[2],my=gp[3];if(p.face<0)mx=16-mx;
 const ox=p.x-3+mx,oy=p.y+p.h-16+my;const sp=wp.sp*(p.rapid?1.25:1);
 const mk2=(vx,vy,o={})=>shots.push({x:ox,y:oy,vx,vy,w:4,h:4,dmg:wp.dmg,k:p.weapon,t:0,hit:new Set(),...o});
 if(p.weapon==='S'){const base=Math.atan2(dy,dx);for(const o of [-0.32,-0.16,0,0.16,0.32])mk2(Math.cos(base+o)*sp,Math.sin(base+o)*sp);SFX.spread();}
 else if(p.weapon==='L'){mk2(dx*sp,dy*sp,{w:6,h:6,pierce:true,dx,dy});SFX.laser();}
 else if(p.weapon==='F'){mk2(dx*sp,dy*sp,{w:7,h:7,bx:ox,by:oy,ph:0,dx,dy});SFX.fire();}
 else{mk2(dx*sp,dy*sp);p.weapon==='M'?SFX.mg():SFX.shoot();}
 addPart({k:'muzzle',x:ox,y:oy,t:0,life:4});
 p.cd=Math.round(wp.cd*rf);}
function hurtPlayer(){const p=pl;if(p.dead||p.inv>0||p.barrier>0||G.state!=='play')return;
 if(p.weapon!=='N'||p.rapid){p.weapon='N';p.rapid=false;p.inv=110;SFX.hurt();shake=8;G.flashT=4;addPart({k:'txt',x:p.x-6,y:p.y-8,s:'OUCH',t:0,life:40,vy:-0.5,c:'#ff8a8a'});}
 else killPlayer();}
function killPlayer(){const p=pl;if(p.dead)return;p.dead=true;p.vy=0;p.vx=0;G.state='dying';G.timer=170;stopTune();playTune('die');}

function updatePlayer(){const p=pl;
 if(p.ride){p.x+=p.ride.dx;p.y+=p.ride.dy;p.ride=null;}
 const L_=held.left,R_=held.right,U=held.up,D=held.down;
 const wantC=D&&p.onGround&&!L_&&!R_;
 if(wantC&&!p.crouch){p.crouch=true;p.y+=5;p.h=9;}
 else if(!wantC&&p.crouch){if(!solidRect(p.x,p.y-5,p.w,5)){p.crouch=false;p.y-=5;p.h=14;}}
 const ice=LV.th.ice&&p.onGround;
 const acc=p.onGround?(ice?0.06:0.15):0.1,max=1.8,fr=p.onGround?(ice?0.02:0.16):0.03;
 let ax=0;if(!p.crouch){if(L_)ax-=1;if(R_)ax+=1;}
 if(ax){p.vx+=ax*acc;if((ax>0)!==(p.vx>0)&&p.onGround&&!ice)p.vx+=ax*acc;p.face=ax;if(Math.abs(p.vx)>max)p.vx=Math.sign(p.vx)*max;}
 else{if(Math.abs(p.vx)<=fr)p.vx=0;else p.vx-=Math.sign(p.vx)*fr;}
 if(p.crouch&&!ax){if(L_)p.face=-1;if(R_)p.face=1;}
 if(pressed.A)p.jbuf=7;else if(p.jbuf>0)p.jbuf--;
 if(p.onGround)p.coyote=6;else if(p.coyote>0)p.coyote--;
 if(p.jbuf>0&&p.coyote>0){if(p.crouch&&!solidRect(p.x,p.y-5,p.w,5)){p.crouch=false;p.y-=5;p.h=14;}p.vy=-5.35-Math.abs(p.vx)*0.22;p.jbuf=0;p.coyote=0;p.onGround=false;SFX.jump();}
 const g=(held.A&&p.vy<0)?0.2:0.48;p.vy=Math.min(p.vy+g,6.2);
 const res=moveBody(p);
 if(res.l||res.r)p.vx=0;

function armed(e,pcx,ecx){if(e.fcd>0)e.fcd--;const dist=Math.abs(pcx-ecx);const onScr=e.x<cam.x+W-4&&e.x+e.w>cam.x+4;

 if(e.type==='shellbot'&&e.st!=='walk')return;
 if(e.charge>0){e.charge--;e.aim=pcx<ecx?-1:1;if(e.charge===0)enemyFire(e,pcx,ecx);return;}
 if(e.fcd<=0&&onScr&&dist<210&&(e.wpn!=='flame'||dist<110)&&(e.type!=='hopper'||e.onGround)){e.charge=20;e.aim=pcx<ecx?-1:1;e.fcd=Math.max(70,150-LV.diff*2)+((Math.random()*40)|0);}}
function enemyFire(e,pcx,ecx){const face=pcx<ecx?-1:1;const ox=ecx+face*10,oy=e.y+(e.type==='bat'?e.h:7);const sp=1.7+LV.w*0.12;
 switch(e.wpn){
  case 'pistol':ebul.push({x:ox,y:oy,w:4,h:4,vx:face*sp,vy:0,t:0});break;
  case 'spread':for(const o of [-0.3,0,0.3])ebul.push({x:ox,y:oy,w:4,h:4,vx:Math.cos(o)*sp*face,vy:Math.sin(o)*sp,t:0});break;
  case 'laser':ebul.push({x:ox,y:oy,w:10,h:3,vx:face*(sp+2.2),vy:0,t:0,k:'laser'});break;
  case 'mortar':ebul.push({x:ecx,y:e.y,w:5,h:5,vx:clamp((pcx-ecx)/50,-2.6,2.6),vy:-4.5,t:0,grav:1,k:'mortar'});break;
  case 'flame':for(let i=0;i<3;i++)ebul.push({x:ox,y:oy-1,w:6,h:6,vx:face*(1.5+i*0.45),vy:(i-1)*0.2,t:0,k:'fire',life:42});break;
  case 'bomb':ebul.push({x:ecx-2,y:e.y+e.h,w:5,h:5,vx:e.vx*0.4,vy:0.6,t:0,grav:1,k:'mortar'});break;}
 if(e.wpn!=='bomb')addPart({k:'muzzle',x:ox,y:oy,t:0,life:4});SFX.eshot();}
function enemyShoot(x,y,tx,ty,sp){const a=Math.atan2(ty-y,tx-x);ebul.push({x:x-2,y:y-2,w:4,h:4,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,t:0});SFX.eshot();}
function updateEnemy(e){e.t++;if(e.flash>0)e.flash--;const p=pl;const pcx=p.x+p.w/2,pcy=p.y+p.h/2,ecx=e.x+e.w/2,ecy=e.y+e.h/2;if(e.wpn)armed(e,pcx,ecx);
 switch(e.type){
  case 'grunt':case 'spiker':{e.vy=Math.min(e.vy+0.4,6);const vx0=e.vx;if(e.charge>0)e.vx=0;const r=moveBody(e,true);if(e.charge>0)e.vx=vx0;if(r.l||r.r)e.vx=-e.vx;if(e.type==='spiker'&&e.onGround&&!groundAhead(e,Math.sign(e.vx)))e.vx=-e.vx;break;}
  case 'hopper':{e.vy=Math.min(e.vy+0.32,6);if(e.onGround){e.vx=0;e.face=pcx<ecx?-1:1;if(e.t%70===0){e.vy=-5;e.vx=e.face*1.2;}}const r=moveBody(e,true);if(r.l||r.r)e.vx=-e.vx;break;}
  case 'shellbot':{e.vy=Math.min(e.vy+0.4,6);
   if(e.st==='walk'){if(e.onGround&&!groundAhead(e,Math.sign(e.vx))&&LV.w>2)e.vx=-e.vx;}
   else if(e.st==='shell'){e.vx=0;e.idle=(e.idle||0)+1;if(e.idle>420){e.st='walk';e.vx=pcx<ecx?-0.45:0.45;e.idle=0;}}
   const r=moveBody(e,true);if(r.l||r.r){e.vx=-e.vx;if(e.st==='kick')SFX.bump();}
   if(e.st==='kick')for(const o of ents)if(o!==e&&o.kind==='enemy'&&!o.dead&&o.type!=='pod'&&ov(e,o)){killEnemy(o,'shell');}
   break;}
  case 'bat':{if(e.st==='hang'){if(Math.abs(pcx-ecx)<120){e.st='fly';e.vx=pcx<ecx?-1.1:1.1;}}
   else{e.vx+=(pcx<ecx?-0.03:0.03);e.vx=clamp(e.vx,-1.5,1.5);e.y+=(pcy-ecy)*0.02+Math.sin(e.t*0.1)*0.9;e.x+=e.vx;}break;}
  case 'turret':{e.ang=Math.atan2(pcy-(e.y+2),pcx-ecx);const rate=Math.max(70,150-LV.diff*2);if(e.t%rate===0&&Math.abs(pcx-ecx)<220&&e.x<cam.x+W&&e.x+e.w>cam.x)enemyShoot(ecx+Math.cos(e.ang)*8,e.y+2+Math.sin(e.ang)*8,pcx,pcy,1.5+LV.w*0.1);break;}
  case 'soldier':{e.vy=Math.min(e.vy+0.4,6);e.face=pcx<ecx?-1:1;const dist=Math.abs(pcx-ecx);
   if(e.onGround){if(dist>96)e.vx=e.face*0.8;else e.vx=0;if(e.vx&&!groundAhead(e,Math.sign(e.vx)))e.vx=0;if(e.t%160===80&&dist<140&&LV.w>=4)e.vy=-4.5;}
   if(e.charge>0)e.vx=0;const r=moveBody(e,true);break;}
  case 'ember':{if(e.st==='wait'){if(e.t>90){e.st='jump';e.y=e.base;e.vy=-6.8;}}else{e.vy+=0.18;e.y+=e.vy;if(e.y>e.base+10){e.st='wait';e.t=0;}}break;}
  case 'pod':{e.x+=e.vx;e.y=e.by+Math.sin(e.t*0.06)*14;if(e.x<cam.x-24)e.dead=true;break;}
 }
 // contact with player
 if(!p.dead&&!e.dead&&G.state==='play'&&ov(p,e)){
  if(p.barrier>0&&e.type!=='pod'){killEnemy(e,'barrier');return;}
  const stompable=e.type!=='spiker'&&e.type!=='ember'&&e.type!=='pod';
  const fromAbove=p.vy>0&&(p.y+p.h-p.vy)<=e.y+5;
  if(e.type==='shellbot'&&e.st==='shell'){e.st='kick';e.vx=(pcx<ecx?1:-1)*4.2;e.idle=0;SFX.kick();G.score+=400;if(fromAbove){p.vy=-4;}p.inv=Math.max(p.inv,8);return;}
  if(fromAbove&&stompable){p.vy=held.A?-6.3:-4.2;
   if(e.type==='turret'){SFX.bump();return;}
   if(e.type==='shellbot'){if(e.st==='walk'||e.st==='kick'){e.st='shell';e.vx=0;e.idle=0;combo++;popScore(e.x,e.y-4,[100,200,400,800,1000,2000][Math.min(5,combo-1)]);SFX.stomp();}return;}
   if(e.type==='soldier'&&e.hp>1){e.hp--;e.flash=8;SFX.stomp();combo++;return;}
   killEnemy(e,'stomp');return;}
  if(p.inv>0)return;hurtPlayer();}}

 if(!p.dead&&G.state==='play'&&ov(p,b)){if(p.barrier>0){if(b.flash<=0)hitBoss(2);}else hurtPlayer();}}

 b.face=pcx<bcx?-1:1;if(b.type==='heli'){heliAI(b);return;}

 const keep=pl?{weapon:pl.weapon,rapid:pl.rapid}:null;
 pl=newPlayer(sx,gh*T-14);if(keep&&G.keepWeapon){pl.weapon=keep.weapon;pl.rapid=keep.rapid;}G.keepWeapon=false;

 LV.podIdx=0;while(LV.podIdx<LV.pods.length&&LV.pods[LV.podIdx]<cam.x+W)LV.podIdx++;

/* ---------- main game update ---------- */
function gameUpdate(){G.frame++;

 for(const L2 of LV.lifts){const old=L2.ax==='x'?L2.x:L2.y;let v=old+L2.sp*L2.dir;if(v<=L2.a){v=L2.a;L2.dir=1;}if(v>=L2.b){v=L2.b;L2.dir=-1;}if(L2.ax==='x'){L2.x=v;L2.dx=v-old;L2.dy=0;}else{L2.y=v;L2.dy=v-old;L2.dx=0;}}
 updatePlayer();if(G.state!=='play'){updateParts();return;}
 // camera
 const target=pl.x+pl.w/2-112;if(target>cam.x)cam.x=Math.min(target,cam.x+4);if(LV.lock!==null)cam.x=Math.min(cam.x,LV.lock);cam.x=clamp(cam.x,0,LV.len*T-W);
 if(LV.lock!==null&&pl.x+pl.w>cam.x+W){pl.x=cam.x+W-pl.w;if(pl.vx>0)pl.vx=0;}
 if(LV.miniX&&!LV.miniOn&&target>=LV.miniX*T){LV.miniOn=true;LV.lock=LV.miniX*T;spawnBoss(true);}
 // spawns
 while(LV.spawnIdx<LV.spawns.length&&LV.spawns[LV.spawnIdx].x<cam.x+W+24){const s=LV.spawns[LV.spawnIdx++];if(s.x>cam.x-16)spawnEnemy(s);}
 while(LV.podIdx<LV.pods.length&&LV.pods[LV.podIdx]<cam.x+W){LV.podIdx++;spawnPod();}
 if(LV.isBoss&&!LV.bossOn&&cam.x>=LV.arenaX*T-1){LV.bossOn=true;spawnBoss();}
 // entities
 for(const e of ents){if(e.dead)continue;
  if(e.kind==='enemy'){updateEnemy(e);if(e.y>ROWS*T+40||e.x<cam.x-80||(e.type!=='pod'&&e.x>cam.x+W+120))e.dead=true;}
  else if(e.type==='medal'||e.type==='heart'){e.t++;e.vy=Math.min(e.vy+0.25,4);const r=moveBody(e,true);if(r.l||r.r)e.vx=-e.vx;if(e.type==='medal'&&r.g&&e.t<200)e.vy=-1.6;
   if(ov(e,pl)&&e.t>8){e.dead=true;if(e.type==='heart')oneUp(e.x,e.y);else takeMedal(e.letter);}if(e.y>ROWS*T+20||e.x<cam.x-40||e.t>900)e.dead=true;}
  else if(e.type==='coinfx'){e.t++;e.y+=e.vy;e.vy+=0.3;if(e.t>22){e.dead=true;addPart({k:'spark',x:e.x+8,y:e.y+8,vx:0,vy:0,t:0,life:8,c:'#fee761'});}}
  else if(e.type==='orb'){e.t++;e.vy=Math.min(e.vy+0.2,3);moveBody(e,false);if(ov(e,pl)){e.dead=true;G.state='clear';G.phase='boss';G.timer=0;playTune('clear');SFX.power();}}}
 ents=ents.filter(e=>!e.dead);
 // shell vs shell bounce / walker turns
 updateBoss();
 // player shots
 for(const s of shots){s.t++;
  if(s.k==='F'){s.bx+=s.vx;s.by+=s.vy;s.ph+=0.35;const px_=-s.dy,py_=s.dx;s.x=s.bx+Math.cos(s.ph)*7*px_+Math.cos(s.ph)*0;s.y=s.by+Math.sin(s.ph)*7*py_+Math.sin(s.ph)*7*(s.dy===0?1:0)*0;s.x=s.bx+(px_*Math.sin(s.ph)*7)+(s.dx*Math.cos(s.ph)*5);s.y=s.by+(py_*Math.sin(s.ph)*7)+(s.dy*Math.cos(s.ph)*5);}
  else{s.x+=s.vx;s.y+=s.vy;}
  const box={x:s.x-s.w/2,y:s.y-s.h/2,w:s.w,h:s.h};
  if(s.x<cam.x-8||s.x>cam.x+W+8||s.y<-16||s.y>H+16){s.dead=true;continue;}
  if(solid(Math.floor(s.x/T),Math.floor(s.y/T))&&s.k!=='F'){s.dead=true;addPart({k:'spark',x:s.x,y:s.y,vx:0,vy:0,t:0,life:6,c:'#ffffff'});continue;}
  for(const e of ents){if(e.kind!=='enemy'||e.dead||s.hit.has(e))continue;if(ov(box,e)){if(e.type==='shellbot'&&e.st==='kick'){}hitEnemy(e,s.dmg);addPart({k:'spark',x:s.x,y:s.y,vx:0,vy:0,t:0,life:6,c:'#ffffff'});if(s.pierce)s.hit.add(e);else{s.dead=true;break;}}}

  if(b.life&&b.t>b.life){b.dead=true;continue;}
  if(!b.wave&&(!b.grav||b.vy>0)&&solid(Math.floor((b.x+2)/T),Math.floor((b.y+2)/T))){b.dead=true;if(b.grav)boomFx(b.x+2,b.y+2,false);continue;}
  if(ov(b,{x:pl.x+1,y:pl.y+1,w:pl.w-2,h:pl.h-2})){if(pl.barrier<=0){b.dead=true;hurtPlayer();}else b.dead=true;}}
 ebul=ebul.filter(b=>!b.dead);
 for(const bp of bumps)bp.t++;bumps=bumps.filter(b=>b.t<10);
 updateParts();
 // timer
 if(++G.sub>=24){G.sub=0;if(G.time>0){G.time--;if(G.time===100)SFX.warn();if(G.time===0)killPlayer();}}
 if(G.banner>0)G.banner--;if(shake>0)shake--;if(G.flashT>0)G.flashT--;}
function takeMedal(l){const p=pl;SFX.power();G.score+=1000;addPart({k:'txt',x:p.x-4,y:p.y-10,s:{M:'MACHINE',S:'SPREAD',L:'LASER',F:'FLAME',R:'RAPID',B:'BARRIER'}[l],t:0,life:50,vy:-0.5,c:'#fee761'});

function updateParts(){for(const q of parts){q.t++;if(q.vx!==undefined&&q.k!=='txt')q.x+=q.vx;if(q.k==='txt')q.y+=q.vy;else if(q.vy!==undefined){q.y+=q.vy;if(q.k==='shard'||q.k==='corpse'||q.k==='spark')q.vy+=q.k==='spark'?0.15:0.3;}}parts=parts.filter(q=>q.t<q.life);}

/* ---------- state updates ---------- */
function menuNav(n){if(pressed.up){G.menu=(G.menu+n-1)%n;SFX.sel();}if(pressed.down){G.menu=(G.menu+1)%n;SFX.sel();}}
function update(){readInput();G.frame++;
 switch(G.state){
  case 'title':{if(!AU.tune&&AU.ctx&&AU.want!=='title')playTune('title');const off=G.run?1:0;menuNav(3+off);
   if(pressed.START||pressed.A){SFX.ok();const m=G.menu-off;if(m<0){continueRun();}else if(m===0){newGame(1,1);}else if(m===1){G.state='select';G.cur=Math.min(G.unlocked-1,G.cur);}else{setSound(!AU.on);save();}}
   if(pressed.SELECT){setSound(!AU.on);save();}break;}
  case 'select':{const c=G.cur;if(pressed.left&&c%4>0)G.cur--;if(pressed.right&&c%4<3)G.cur++;if(pressed.up&&c>=4)G.cur-=4;if(pressed.down&&c<28)G.cur+=4;if(G.cur!==c)SFX.sel();
   if(pressed.B){G.state='title';SFX.sel();}else if((pressed.A||pressed.START)){if(G.cur<G.unlocked){SFX.ok();newGame((G.cur>>2)+1,(G.cur%4)+1);}else SFX.bump();}break;}
  case 'intro':{G.timer--;if(G.timer<=0||(G.timer<120&&(pressed.A||pressed.START)))startLevel();break;}
  case 'play':gameUpdate();break;
  case 'pause':{menuNav(3);if(pressed.START&&G.menu===0){resumeGame();break;}if(pressed.A||pressed.START){if(G.menu===0)resumeGame();else if(G.menu===1){setSound(!AU.on);save();}else{keepRun();toTitle();}}if(pressed.SELECT){setSound(!AU.on);save();}break;}
  case 'dying':{const p=pl;G.timer--;if(G.timer===130)for(let i=0;i<6;i++){const a=i*Math.PI/3;addPart({k:'spark',x:p.x+p.w/2,y:p.y+p.h/2,vx:Math.cos(a)*1.2,vy:Math.sin(a)*1.2-0.6,t:0,life:16,c:i%2?'#ffffff':'#fee761'});}updateParts();if(G.timer<=0){G.lives--;if(G.lives<0){G.state='gameover';G.menu=0;playTune('over');
     // saved run becomes what CONTINUE on this screen gives: the world's first stage, fresh lives
     G.run={world:G.world,level:1,cpIdx:-1,lives:3,score:0,coins:0};save();}else{keepRun();toIntro();}}break;}
  case 'clear':updateClear();break;
  case 'gameover':{menuNav(2);if(pressed.A||pressed.START){if(G.menu===0){G.lives=3;G.score=0;G.coins=0;G.level=1;G.cpIdx=-1;pl=null;toIntro();}else{G.run=null;toTitle();}}break;}
  case 'ending':{G.timer++;if(G.timer>120&&(pressed.START||pressed.A))toTitle();break;}}}
function newGame(w,l){G.world=w;G.level=l;G.lives=3;G.score=0;G.coins=0;G.cpIdx=-1;pl=null;toIntro();}
function continueRun(){const r=G.run;G.world=r.world;G.level=r.level;G.lives=r.lives;G.score=r.score;G.coins=r.coins;G.cpIdx=r.cpIdx;pl=null;toIntro();}
function titleItems(){const snd='SOUND: '+(AU.on?'ON':'OFF');return G.run?['CONTINUE '+G.run.world+'-'+G.run.level,'NEW GAME','STAGE SELECT',snd]:['START GAME','STAGE SELECT',snd];}
function toTitle(){G.state='title';G.menu=0;stopTune();if(AU.mg&&AU.ctx)AU.mg.gain.setTargetAtTime(0.32,AU.ctx.currentTime,0.05);playTune('title');save();}

/* ---------- loop ---------- */
let acc=0,last=performance.now();const STEP=1000/60;
function loop(now){acc+=Math.min(100,now-last);last=now;let n=0;while(acc>=STEP&&n<4){update();acc-=STEP;n++;}if(n===4)acc=0;draw();requestAnimationFrame(loop);}
